<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Noto Sans CJK KR",sans-serif;background:#0d1724;color:#fff;position:relative}
.court{position:absolute;inset:0}
.wrap{position:absolute;left:84px;top:96px;right:420px}
.eyebrow{font-size:22px;letter-spacing:.32em;color:#8fb3e8;font-weight:700}

.chips{display:flex;gap:14px;margin-top:38px}
.chip{font-size:28px;font-weight:700;padding:10px 22px;border-radius:999px;border:2px solid}
.q{color:#d2b0f5;border-color:#8a4fc4;background:rgba(138,79,196,.18)}
.o{color:#f5bd84;border-color:#c26a12;background:rgba(194,106,18,.18)}
.foot{position:absolute;left:84px;bottom:64px;font-size:26px;color:#a9b8c9;font-weight:500}
.foot b{color:#fff}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(#8a4fc4,#c26a12)}
</style></head><body>
<svg class="court" viewBox="0 0 1200 630" width="1200" height="630">
  <g fill="none" stroke="#24395a" stroke-width="5">
    <line x1="760" y1="-10" x2="760" y2="640"/>
    <circle cx="760" cy="315" r="120"/>
    <path d="M1210 95 H1080 V535 H1210"/>
    <line x1="1180" y1="215" x2="1180" y2="415" stroke="#3a5a8a" stroke-width="10"/>
  </g>
  
</svg>
<div class="bar"></div>
<div class="wrap">
  <div class="eyebrow">SEOUL WHEELCHAIR RUGBY</div>
  <h1>서울휠체어럭비<br>선수단</h1>
  <div class="chips"><span class="chip q">우림맨테크 · 쿼드</span><span class="chip o">송파씨젠 · 오픈</span></div>
</div>

</body></html>
