/* 공유용 화면: 저장소 대신 snapshot.json 을 읽어요. 수정 불가, 개인정보 없음 */
(function(){
  let snapP = null;
  const load = () => snapP || (snapP = fetch('snapshot.json', {cache: 'no-store'}).then(r => r.json()));
  const docsOf = (s, col) => Object.entries(s.data[col] || {}).map(([id, v]) => ({ id, data: () => v }));
  const db = {
    collection: col => ({ onSnapshot: (next) => { load().then(s => next({ docs: docsOf(s, col) })); return () => {}; } }),
    doc: () => ({ set: async () => {}, update: async () => {}, delete: async () => {} })
  };
  // 앱 코드의 window.claude 는 빌드할 때 window.__claudeSnap 으로 바꿔 둬요 (플랫폼 객체는 건드리지 않음)
  window.__claudeSnap = { use: async n => {
    if (n === 'db') return db;
    if (n === 'user') return { canEdit: async () => false, isOwner: async () => false };
    if (n === 'assets') return null;
    const r = window.claude; if (r && r.use) return r.use(n);
    // claude.ai 밖(깃허브 페이지)에서는 브라우저 기본 다운로드로 저장
    if (n === 'downloads') return { save: async ({ filename, data }) => { const b = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return { status: 'saved' }; } };
    return null; } };
  load().then(s => {
    window.__snapAsOf = s.asOf;
    const put = () => { const m = document.getElementById('mode'); if (!m) return setTimeout(put, 100); m.className = 'pill ro'; m.textContent = '공유용 · ' + s.asOf.replace(/-/g, '.') + ' 기준'; };
    const keep = () => { put(); setTimeout(keep, 1500); }; keep();
  });
})();
</script>

function spark(pts, label, dir, std, best, key) {

  const W = 220, H = 74, L = 6, R = 6, T = 10, B = 18; const multiYr = new Set(pts.map(p => p[0].slice(0, 4))).size > 1;
  if (!vals.length) return `<div class="panel" style="padding:10px"><div class="small muted">${label}</div><div class="muted">–</div></div>`;
  let lo = Math.min(...vals, std ?? Infinity), hi = Math.max(...vals, std ?? -Infinity); if (lo === hi) { lo -= 1; hi += 1; } const padv = (hi - lo) * .12; lo -= padv; hi += padv;
  const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = v => dir === 'hi' ? T + (hi - v) / (hi - lo) * (H - T - B) : T + (v - lo) / (hi - lo) * (H - T - B); // lower time drawn higher
  const P2 = pts.map((p, i) => p[1] == null ? null : [x(i), y(p[1])]).filter(Boolean);
  const path = P2.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

  <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label} 변화">
    ${std != null ? `<line x1="${L}" x2="${W - R}" y1="${y(std).toFixed(1)}" y2="${y(std).toFixed(1)}" stroke="var(--good)" stroke-dasharray="3 3" stroke-width="1"/>` : ''}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${P2.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === P2.length - 1 ? 3.5 : 2.2}" fill="${i === P2.length - 1 ? 'var(--accent)' : 'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
    ${pts.map((p, i) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" font-size="9.5" text-anchor="middle" fill="var(--ink3)" font-family="IBM Plex Mono, monospace">${multiYr ? p[0].slice(2, 4) + '.' + +p[0].slice(5) : +p[0].slice(5) + '월'}</text>`).join('')}
  </svg><div class="small muted">역대 최고 <span class="num">${best != null ? fmt(best) + unit : '–'}</span>${std != null ? ` · 기준 <span class="num">${std}${unit}</span>` : ''}</div></div>`;
}

  const add = (type, occ) => e.rooms.push({ id: 'r' + Date.now().toString(36) + e.rooms.length, type, occ, personal: 0 });
  left.filter(q => q.single && !q.guardian).slice().forEach(q => { take(q.key); add('1인실', [q.key]); const g = take('g:' + q.key); if (g) add('2인실', [g.key]); });
  left.filter(q => !q.guardian).slice().forEach(q => { const g = left.find(z => z.key === 'g:' + q.key); if (g) { take(q.key); take(g.key); add('2인실', [q.key, g.key]); } });

}

async function readFitXlsx(file) {

    const rows = X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });

    }

    case 'export': doExport(); break;

document.addEventListener('input', ev => {

// ---------- photo uploads (file picker + paste) ----------
const upErr = e => toast(e && e.code === 'too_large' ? '사진이 너무 커요 (20MB 이하)' : e && e.code === 'unsupported_type' ? 'JPG·PNG 사진만 올릴 수 있어요' : e && e.code === 'quota_or_state' ? '사진 저장 공간이 가득 찼어요' : '사진을 올리지 못했어요');
async function uploadEvidence(d, files) {
  toast(`사진 ${files.length}장 올리는 중…`); const ids = [];
  for (const f of files) { try { ids.push((await uploadImage(f, 1600)).id); } catch (e) { upErr(e); } }

  const mk = d.slice(0, 7); const m = monthDoc(mk); m.photos[d] = (m.photos[d] || []).concat(ids); if (!m.days.includes(d)) { m.days.push(d); m.days.sort(); }
  commitMonth(mk, m); toast(`증빙 사진 ${ids.length}장을 저장했어요`);
}
function uploadEntityPhoto(kind, id, side, file) {
  toast('사진 올리는 중…');
  uploadImage(file).then(r => {
    const col = kind === 'player' ? 'players' : 'chairs'; const src = kind === 'player' ? S.players : S.chairs;
    const doc = clone(src[id]); let old;
    if (kind === 'chair') { side = side || SIDES.map(x => x[0]).find(k => !(doc.photos || {})[k]) || 'front'; doc.photos = doc.photos || {}; old = doc.photos[side] || (side === 'front' ? doc.photo : ''); doc.photos[side] = r.id; if (side === 'front' || !doc.photo) doc.photo = side === 'front' ? r.id : (doc.photo || r.id); }
    else { old = doc.photo; doc.photo = r.id; }
    src[id] = doc;
    return saveDoc(col + '/' + id, doc).then(() => {
      if (old && old !== r.id) S.assets.delete(old).catch(() => {});
      if (D && D.id === id) { if (kind === 'player') D.draft.p.photo = r.id; else { D.draft.photo = doc.photo; D.draft.photos = doc.photos; } renderDrawer(); }
      render(); toast(kind === 'chair' ? `${SIDES.find(x => x[0] === side)[1]} 사진을 저장했어요` : '사진을 저장했어요');
    });
  }).catch(upErr);
}
document.addEventListener('paste', e => {
  const tgt = e.target; if (tgt && /^(INPUT|TEXTAREA)$/.test(tgt.tagName) && tgt.type !== 'file') return;

  e.preventDefault();
  if (D && D.kind === 'player' && S.players[D.id]) return uploadEntityPhoto('player', D.id, null, files[0]);
  if (D && D.kind === 'chair' && S.chairs[D.id]) return uploadEntityPhoto('chair', D.id, null, files[0]);
  if (!D && S.tab === 'att' && S.attView === 'check') { if ((S.dates || []).length > 1) { toast('사진은 날짜를 하나만 골랐을 때 붙여넣을 수 있어요'); return; } return uploadEvidence(S.date, files); }
  toast('출석 체크 화면, 선수 화면, 휠체어 화면에서 붙여넣을 수 있어요');
});
// 숙박 칸: 누른 채로 끌어서 여러 칸 칠하기
let PAINT = null;
const paintCell = c => { const k = c.dataset.i + '|' + c.dataset.d; if (PAINT.cells.has(k)) return; PAINT.cells.add(k); c.classList.toggle('on', PAINT.on); };
